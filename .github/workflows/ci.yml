name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dependabot PRs are merged with GITHUB_TOKEN, and pushes made with that token
  # never trigger workflows, so those merges would otherwise never be published.
  # The daily run publishes main only if its commit is not already on GHCR.
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it may be halfway through pushing images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-compose:
    name: Validate Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate compose.yaml syntax
        run: |
          DOMAIN=example.com \
          SUBDOMAIN=jellyfin \
          HOSTED_ZONE_ID=Z0123456789ABCDEF \
          AWS_ACCESS_KEY_ID=MOCK_KEY_ID \
          AWS_SECRET_ACCESS_KEY=MOCK_SECRET_KEY \
          docker compose config --quiet

  build-and-validate-caddy:
    name: Build Caddy & Validate Caddyfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Caddy image with Route53 plugin
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: proxyfin-caddy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Caddyfile syntax
        run: |
          docker run --rm \
            -e DOMAIN=example.com \
            -e SUBDOMAIN=jellyfin \
            -e HOSTED_ZONE_ID=Z0123456789ABCDEF \
            -v ${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile:ro \
            proxyfin-caddy:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  build-and-test-ddns:
    name: Build DDNS Init & Test Config Rendering
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ddns-init image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ddns-init
          load: true
          tags: proxyfin-ddns-init:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test DDNS config generation
        run: |
          mkdir -p ./tmp-output
          docker run --rm \
            -e DOMAIN=testdomain.org \
            -e SUBDOMAIN=testmedia \
            -e HOSTED_ZONE_ID=Z987654321 \
            -e AWS_ACCESS_KEY_ID=AKIA_MOCK_TEST \
            -e AWS_SECRET_ACCESS_KEY=MOCK_SECRET_TEST \
            -e IP_VERSION="ipv4 or ipv6" \
            -v ${{ github.workspace }}/config/ddns.json.template:/template/ddns.json.template:ro \
            -v ${{ github.workspace }}/tmp-output:/output \
            proxyfin-ddns-init:ci

          test -f ./tmp-output/config.json
          jq . ./tmp-output/config.json
          grep "testmedia.testdomain.org" ./tmp-output/config.json
          grep "Z987654321" ./tmp-output/config.json
          grep "AKIA_MOCK_TEST" ./tmp-output/config.json

  lint-shell:
    name: Lint Shell Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./docker

  lint-powershell:
    name: Lint PowerShell Diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./Verify-Setup.ps1 -Severity Error
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          } else {
            Write-Host "PSScriptAnalyzer passed with 0 errors."
          }

  publish:
    name: Publish Container Images to GHCR
    needs:
      - validate-compose
      - build-and-validate-caddy
      - build-and-test-ddns
      - lint-shell
      - lint-powershell
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this commit is already published
        id: published
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          if docker manifest inspect "ghcr.io/$OWNER/proxyfin-caddy:$SHA" >/dev/null 2>&1 &&
             docker manifest inspect "ghcr.io/$OWNER/proxyfin-ddns-init:$SHA" >/dev/null 2>&1; then
            echo "Both images for $SHA are already on GHCR; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Caddy image
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/proxyfin-caddy:latest
            ghcr.io/${{ github.repository_owner }}/proxyfin-caddy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push DDNS init image
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ddns-init
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/proxyfin-ddns-init:latest
            ghcr.io/${{ github.repository_owner }}/proxyfin-ddns-init:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune old Caddy image versions
        if: steps.published.outputs.skip != 'true'
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'proxyfin-caddy'
          package-type: 'container'
          min-versions-to-keep: 3
          ignore-versions: '^latest$'

      - name: Prune old DDNS init image versions
        if: steps.published.outputs.skip != 'true'
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'proxyfin-ddns-init'
          package-type: 'container'
          min-versions-to-keep: 3
          ignore-versions: '^latest$'
