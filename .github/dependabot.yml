version: 2
updates:
  # Monitor base images in Dockerfile and Dockerfile.ddns-init
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  # Monitor compose service images (qmcgaw/ddns-updater)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 3
