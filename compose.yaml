services:
  caddy:
    build: .
    container_name: proxyfin-caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    environment:
      - DOMAIN=${DOMAIN}
      - SUBDOMAIN=${SUBDOMAIN}
      - HOSTED_ZONE_ID=${HOSTED_ZONE_ID}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./config/caddy:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ddns-config:
    build:
      context: .
      dockerfile: Dockerfile.ddns-init
    container_name: proxyfin-ddns-config
    environment:
      - DOMAIN=${DOMAIN}
      - SUBDOMAIN=${SUBDOMAIN}
      - HOSTED_ZONE_ID=${HOSTED_ZONE_ID}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - IP_VERSION=${IP_VERSION:-ipv4 or ipv6}
    volumes:
      - ./config/ddns.json.template:/template/ddns.json.template:ro
      - ./data/ddns:/output
    restart: "no"

  ddns-updater:
    image: qmcgaw/ddns-updater:v2.10.0
    container_name: proxyfin-ddns
    restart: unless-stopped
    depends_on:
      ddns-config:
        condition: service_completed_successfully
    environment:
      - PERIOD=${DDNS_PERIOD:-3600s}
      - UPDATE_COOLDOWN_PERIOD=${DDNS_UPDATE_COOLDOWN_PERIOD:-300s}
      - CONFIG_FILEPATH=/updater/data/config.json
      # Pinned to a single HTTP provider (instead of "all") so only one
      # domain (api64.ipify.org) needs to bypass a split-tunnel VPN like
      # Cloudflare WARP for public IP detection to stay accurate.
      - PUBLICIP_FETCHERS=http
      - PUBLICIP_HTTP_PROVIDERS=ipify
      - PUBLICIPV4_HTTP_PROVIDERS=ipify
      - PUBLICIPV6_HTTP_PROVIDERS=ipify
    volumes:
      - ./data/ddns:/updater/data
